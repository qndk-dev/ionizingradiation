name: Bug Report
description: Something is broken
title: "[BUG] "
labels: ["bug"]
body:
  - type: checkboxes
    id: latest
    attributes:
      label: Checklist
      options:
        - label: I am using the latest version of the mod
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true

  - type: input
    id: logs
    attributes:
      label: Logs / Crash Report
      description: Upload your logs to [mclo.gs](https://mclo.gs/) and paste the link here.
    validations:
      required: true
