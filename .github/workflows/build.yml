name: build

on:
  push:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'LICENSE'
      - '.github/'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'LICENSE'
      - '.github/'
      - '.gitignore'
      - '.gitattributes'

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
